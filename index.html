<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Thailand Trip｜Aug 26–29 Pattaya & Bangkok</title>
<link rel="preconnect" href="https://unpkg.com">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
:root{
  --bg:#f4f1ea;--card:#fff;--ink:#172624;--sub:#65726e;
  --teal:#0f766e;--teal2:#16877d;--orange:#c86c08;--blue:#2563eb;
  --line:#e1e8e5;--soft:#eaf6f3;--warm:#fff6e8;--shadow:0 12px 34px rgba(35,52,48,.08)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:radial-gradient(circle at 0 0,rgba(15,118,110,.09),transparent 31%),var(--bg);
  color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",
  "Noto Sans Thai","Hiragino Sans","Yu Gothic UI","Meiryo",Arial,sans-serif
}
.wrap{max-width:1140px;margin:auto;padding:24px 18px 60px}
.hero{background:linear-gradient(135deg,#0d5954,#13867c);color:#fff;border-radius:27px;padding:28px;box-shadow:var(--shadow)}
.topbar{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.brand{font-size:12px;letter-spacing:.13em;text-transform:uppercase;opacity:.8}
.langbox,.currencybox{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.langbox span,.currencybox span{font-size:12px;opacity:.82}
.langbtn,.currencybtn{
  border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.10);color:#fff;
  border-radius:999px;padding:7px 10px;font-size:12px;cursor:pointer
}
.langbtn.active,.currencybtn.active{background:#fff;color:#0f665f;border-color:#fff;font-weight:800}
h1{font-size:clamp(30px,5vw,50px);margin:3px 0 8px;line-height:1.08}
.hero p{margin:0;color:#e8fffb;line-height:1.6}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:17px}
.badge{font-size:12px;padding:7px 10px;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:rgba(255,255,255,.12)}
.nav{position:sticky;top:8px;z-index:800;display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.nav a{text-decoration:none;background:#fff;color:var(--teal);font-size:13px;font-weight:800;padding:9px 13px;border-radius:999px;border:1px solid #dae8e4;box-shadow:0 5px 13px rgba(32,50,45,.06)}
.section{scroll-margin-top:70px;margin-top:24px}
.dayhead{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:12px}
.dayhead h2{font-size:25px;margin:0}
.daytheme{font-size:12px;color:var(--teal);font-weight:800;background:var(--soft);padding:7px 10px;border-radius:999px}
.grid{display:grid;grid-template-columns:1.12fr .88fr;gap:19px}
.card{background:#fff;border-radius:21px;padding:20px;box-shadow:var(--shadow);border:1px solid rgba(20,40,35,.04)}
.timeline{position:relative;margin-left:4px}
.timeline:before{content:"";position:absolute;left:13px;top:9px;bottom:15px;width:2px;background:var(--line)}
.item{display:grid;grid-template-columns:27px 90px 1fr;gap:10px;margin-bottom:23px;position:relative}
.dot{width:27px;height:27px;border-radius:50%;background:var(--teal);border:6px solid var(--soft);z-index:2}
.time{font-size:13px;font-weight:800;padding-top:5px}
.event strong{display:block;font-size:15.5px;margin-bottom:5px}
.desc{font-size:13.5px;line-height:1.62;color:#4c5a57;margin-bottom:9px}
.projectbar{
  display:grid;grid-template-columns:auto auto 1fr 1fr;gap:7px;align-items:stretch;margin-top:10px
}
.action{
  text-decoration:none;font-size:11.5px;font-weight:800;padding:9px 10px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;white-space:nowrap
}
.mapaction{background:#edf8f5;color:#0d6c64;border:1px solid #d0e8e1}
.webaction{background:#fff7ec;color:#935706;border:1px solid #f0d8b3}
.moneybox{padding:8px 10px;border-radius:9px;border:1px solid #e0e7e4;background:#f8faf9;min-width:0}
.moneylabel{font-size:10px;color:#6b7874;margin-bottom:3px;font-weight:800}
.estimate{font-size:12px;font-weight:800;color:#285a77;line-height:1.35}
.actualrow{display:flex;align-items:center;gap:5px}
.actualrow input{
  width:82px;min-width:0;border:1px solid #ccd9d5;border-radius:7px;padding:6px 7px;
  font-size:12px;background:#fff;color:#162724
}
.currency{font-size:11px;font-weight:800;color:#485854}
.jpycalc{font-size:10px;color:#71807b;margin-top:3px}
.map{height:455px;border-radius:16px;overflow:hidden;background:#e8ecea}
.mapnote{font-size:11px;color:var(--sub);line-height:1.55;margin-top:8px}
.summary{
  margin-top:20px;background:#fff;border-radius:21px;padding:20px;box-shadow:var(--shadow)
}
.summarytop{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}
.summary h3{margin:0;font-size:18px}
.total{font-size:21px;font-weight:900;color:var(--teal)}
.total small{font-size:11px;color:var(--sub);font-weight:600}
.sumgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.sumcard{padding:13px;background:#f7faf9;border-radius:13px;border:1px solid #e7ecea}
.sumlabel{font-size:11px;color:var(--sub);margin-bottom:5px}
.sumvalue{font-size:17px;font-weight:850}
.reset{
  border:1px solid #ead5cc;background:#fff7f4;color:#98503c;border-radius:9px;padding:8px 10px;
  font-size:11px;font-weight:800;cursor:pointer
}
.footer{text-align:center;font-size:10.5px;line-height:1.6;color:#788581;margin-top:20px}
@media(max-width:880px){
  .grid{grid-template-columns:1fr}
  .projectbar{grid-template-columns:1fr 1fr}
  .moneybox{grid-column:span 1}
  .map{height:390px}
}
@media(max-width:560px){
  .wrap{padding:15px 11px 45px}.hero{padding:21px;border-radius:21px}
  .item{grid-template-columns:26px 71px 1fr;gap:8px}
  .projectbar{grid-template-columns:1fr 1fr}
  .sumgrid{grid-template-columns:1fr}
  .action{white-space:normal;text-align:center}
}
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
  <div class="topbar">
    <div class="brand">Thailand Trip · Pattaya · Koh Larn · Bangkok</div>
    <div class="langbox">
      <span id="languageLabel">语言</span>
      <button class="langbtn active" data-lang="zh">中文</button>
      <button class="langbtn" data-lang="en">English</button>
      <button class="langbtn" data-lang="ja">日本語</button>
      <button class="langbtn" data-lang="th">ไทย</button>
    </div>
    <div class="currencybox">
      <span id="currencyLabel">预算币种</span>
      <button class="currencybtn active" data-currency="THB">THB ฿</button>
      <button class="currencybtn" data-currency="JPY">JPY ¥</button>
    </div>
  </div>
  <h1 id="heroTitle"></h1>
  <p id="heroSubtitle"></p>
  <div class="badges">
    <span class="badge" id="hotelBadge"></span>
    <span class="badge" id="rateBadge"></span>
    <span class="badge" id="saveBadge"></span>
  </div>
</header>

<nav class="nav">
  <a href="#day26" id="nav26"></a>
  <a href="#day27" id="nav27"></a>
  <a href="#day28" id="nav28"></a>
  <a href="#day29" id="nav29"></a>
  <a href="#summary" id="navSummary"></a>
</nav>

<section class="section" id="day26">
  <div class="dayhead"><h2 id="day26Title"></h2><div class="daytheme" id="day26Theme"></div></div>
  <div class="grid">
    <div class="card"><div class="timeline" id="timeline26"></div></div>
    <div class="card"><h3 id="map26Title" style="margin:0 0 11px"></h3><div class="map" id="map26"></div><div class="mapnote" id="map26Note"></div></div>
  </div>
</section>

<section class="section" id="day27">
  <div class="dayhead"><h2 id="day27Title"></h2><div class="daytheme" id="day27Theme"></div></div>
  <div class="grid">
    <div class="card"><div class="timeline" id="timeline27"></div></div>
    <div class="card"><h3 id="map27Title" style="margin:0 0 11px"></h3><div class="map" id="map27"></div><div class="mapnote" id="map27Note"></div></div>
  </div>
</section>

<section class="section" id="day28">
  <div class="dayhead"><h2 id="day28Title"></h2><div class="daytheme" id="day28Theme"></div></div>
  <div class="grid">
    <div class="card"><div class="timeline" id="timeline28"></div></div>
    <div class="card"><h3 id="map28Title" style="margin:0 0 11px"></h3><div class="map" id="map28"></div><div class="mapnote" id="map28Note"></div></div>
  </div>
</section>

<section class="section" id="day29">
  <div class="dayhead"><h2 id="day29Title"></h2><div class="daytheme" id="day29Theme"></div></div>
  <div class="grid">
    <div class="card"><div class="timeline" id="timeline29"></div></div>
    <div class="card"><h3 id="map29Title" style="margin:0 0 11px"></h3><div class="map" id="map29"></div><div class="mapnote" id="map29Note"></div></div>
  </div>
</section>

<section class="summary section" id="summary">
  <div class="summarytop">
    <h3 id="summaryTitle"></h3>
    <button class="reset" id="resetBtn"></button>
  </div>
  <div class="sumgrid">
    <div class="sumcard"><div class="sumlabel" id="actualThbLabel"></div><div class="sumvalue" id="actualThb">฿0</div></div>
    <div class="sumcard"><div class="sumlabel" id="actualJpyLabel"></div><div class="sumvalue" id="actualJpy">¥0</div></div>
    <div class="sumcard"><div class="sumlabel" id="filledLabel"></div><div class="sumvalue" id="filledCount">0 / 0</div></div>
  </div>
</section>

<div class="footer" id="footer"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="ui.js"></script>
<script src="plans-a.js"></script>
<script src="plans-b.js"></script>
<script src="plans-c.js"></script>
<script src="app.js"></script>
</body>
</html>
